<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <form
    [formGroup]="registerForm"
    (ngSubmit)="onSubmit()"
    class="bg-white p-8 rounded shadow-md w-full max-w-sm"
  >
    <h2 class="text-2xl font-bold mb-6 text-center">Register</h2>

    <!-- Username -->
    <div class="mb-4">
      <label class="block mb-1 font-semibold">Username</label>
      <input
        type="text"
        formControlName="username"
        class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500"
      />
      <div *ngIf="submitted && username?.errors" class="text-red-500 text-sm mt-1">
        Username is required
      </div>
    </div>

    <!-- Password -->
    <div class="mb-4">
      <label class="block mb-1 font-semibold">Password</label>
      <input
        type="password"
        formControlName="password"
        class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500"
      />
      <div *ngIf="submitted && password?.errors" class="text-red-500 text-sm mt-1">
        Password must be at least 6 characters
      </div>
    </div>

    <!-- Confirm Password -->
    <div class="mb-6">
      <label class="block mb-1 font-semibold">Confirm Password</label>
      <input
        type="password"
        formControlName="confirmPassword"
        class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500"
      />
      <div
        *ngIf="submitted && registerForm.errors?.['passwordMismatch']"
        class="text-red-500 text-sm mt-1"
      >
        Passwords do not match
      </div>
    </div>

    <button
      type="submit"
      class="w-full bg-green-500 text-white font-bold py-2 px-4 rounded hover:bg-green-600 transition"
    >
      Register
    </button>
  </form>
</div>
