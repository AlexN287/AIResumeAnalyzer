<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="bg-white p-8 rounded shadow-md w-full max-w-sm">
    <h2 class="text-2xl font-bold mb-6 text-center">Login</h2>

    <div class="mb-4">
      <label class="block mb-1 font-semibold">Username</label>
      <input type="text" formControlName="username"
        class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
      <div *ngIf="submitted && username?.errors" class="text-red-500 text-sm mt-1">
        Username is required
      </div>
    </div>

    <div class="mb-6">
      <label class="block mb-1 font-semibold">Password</label>
      <input type="password" formControlName="password"
        class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
      <div *ngIf="submitted && password?.errors" class="text-red-500 text-sm mt-1">
        Password is required
      </div>
    </div>

    <button type="submit"
      class="w-full bg-blue-500 text-white font-bold py-2 px-4 rounded hover:bg-blue-600 transition">
      Login
    </button>

    <div class="mt-4 text-center">
      <span class="text-sm text-gray-600">Don't have an account?</span>
      <button type="button" (click)="goToRegister()" class="ml-2 text-blue-600 hover:underline text-sm font-semibold">
        Register
      </button>
    </div>
  </form>

</div>
